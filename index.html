<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShineMoon Company</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
  <div class="logo">🌙 ShineMoon Company</div>
  <p>Building Service Management System</p>
</header>

<section class="stats">
  <div class="card">
    <h3 id="clientsCount">0</h3>
    <p>Clients</p>
  </div>

  <div class="card">
    <h3 id="projectsCount">0</h3>
    <p>Projects</p>
  </div>

  <div class="card">
    <h3 id="workersCount">0</h3>
    <p>Workers</p>
  </div>

  <div class="card">
    <h3>KSh <span id="revenueCount">0</span></h3>
    <p>Total Revenue</p>
  </div>
</section>

<h2>Dashboard</h2>

<button>Clients</button>
<button>Projects</button>
<button>Workers</button>
<button>Materials</button>
<button>Payments</button>
<button>Invoices</button>

<h2>Register Client</h2>

<input type="text" placeholder="Client Name">
<input type="text" placeholder="Phone Number">
<input type="text" placeholder="Location">

<button>Save Client</button>

<h3>Client List</h3>

<h2>Register Project</h2>

<input type="text" placeholder="Project Name">
<input type="text" placeholder="Project Location">
<input type="number" placeholder="Budget (KSh)">

<button>Save Project</button>

<h3>Project List</h3>

<h2>Register Worker</h2>

<input type="text" placeholder="Worker Name">
<input type="text" placeholder="Phone Number">
<input type="text" placeholder="Job Role">
<input type="number" placeholder="Daily Wage (KSh)">

<button>Save Worker</button>

<h3>Worker List</h3>

<script src="script.js"></script>
</body>
</html>
